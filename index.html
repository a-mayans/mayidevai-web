<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>MayidevAI | Automatización de procesos e IA para empresas</title>
    <meta
      name="description"
      content="MayidevAI ayuda a empresas a automatizar procesos con n8n, Make y agentes de IA. Reduce costes, ahorra tiempo y escala tu negocio con automatización a medida."
    />
    <meta name="author" content="MayidevAI" />
    <meta name="robots" content="index, follow" />

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />

    <!-- Open Graph (WhatsApp, LinkedIn, Facebook, etc) -->
    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="MayidevAI | Automatización e IA para empresas"
    />
    <meta
      property="og:description"
      content="Automatizo procesos empresariales con n8n, Make y agentes de IA para que tu negocio sea más eficiente y rentable."
    />
    <!-- Pon aquí tu dominio cuando lo tengas -->
    <meta property="og:url" content="https://mayidevai.com" />
    <meta
      property="og:image"
      content="https://mayidevai.com/og-mayidevai.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="MayidevAI | Automatización e IA para empresas"
    />
    <meta
      name="twitter:description"
      content="Automatización de procesos con IA, n8n y Make para empresas que quieren escalar sin fricción."
    />
    <meta
      name="twitter:image"
      content="https://mayidevai.com/og-mayidevai.png"
    />

    <!-- Canonical -->
    <link rel="canonical" href="https://mayidevai.com/" />

    <!-- Structured Data (Schema.org) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "MayidevAI",
        "url": "https://mayidevai.com",
        "logo": "https://mayidevai.com/og-mayidevai.png",
        "description": "Automatización de procesos e IA para empresas. Diseño e implemento automatizaciones con n8n, APIs e inteligencia artificial.",
        "foundingDate": "2024",
        "contactPoint": {
          "@type": "ContactPoint",
          "contactType": "customer service",
          "availableLanguage": ["Spanish", "English"]
        },
        "sameAs": []
      }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
